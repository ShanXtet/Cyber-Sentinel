# Reverse proxy in front of OpenCTI (HTTPS termination).
# Mount this into the nginx container from docker-compose.proxy.yml.

upstream opencti_upstream {
    server opencti:8080;
}

server {
    listen 80;
    server_name _;
    # Redirect HTTP -> HTTPS when TLS certs are mounted
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 100m;

    location / {
        proxy_pass http://opencti_upstream;
        proxy_http_version 1.1;
        proxy_cache off;
        proxy_buffering off;
        chunked_transfer_encoding off;

        # WebSocket / GraphQL subscriptions
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
